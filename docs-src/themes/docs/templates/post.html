<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="stylesheet" href="{{base_path}}/style.css">
    <script>
    /* Runs before the first paint, so a reader who chose a scheme never
       sees the other one flash first. */
    (function () {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{base_path}}/">{{site_title}}</a>
        <span class="version">{{version}}</span>
        <button class="theme-toggle" type="button"
                aria-label="Switch between light and dark">
            <span class="in-light">Dark</span>
            <span class="in-dark">Light</span>
        </button>
    </header>
    <div class="layout">
        <aside class="sidebar">
            {{page_tree}}
            <footer class="site-footer">{{built_with}}</footer>
        </aside>
        <main>
            <article>
                <h1>{{title}}</h1>
                <time>{{date}}</time>
                {{content}}
            </article>
            <nav class="post-nav">
                <a class="prev" href="{{prev_url}}">{{prev_title}}</a>
                <a class="next" href="{{next_url}}">{{next_title}}</a>
            </nav>
            <a class="edit" href="{{edit_url}}">Edit this page</a>
        </main>
    </div>
    <script>
    (function () {
        var here = location.pathname;
        document.querySelectorAll('.sidebar > ul a').forEach(function (a) {
            if (a.getAttribute('href') === here) a.classList.add('active');
        });

        var root = document.documentElement;
        var button = document.querySelector('.theme-toggle');
        if (button) button.addEventListener('click', function () {
            /* No stored choice yet means we are following the system. */
            var now = root.getAttribute('data-theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark' : 'light');
            var next = now === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    })();
    </script>
</body>
</html>
